# Source: code-server/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/instance: code-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: code-server
    helm.sh/chart: code-server-0.1.0
spec:
  replicas: 1
  # code-server keeps all state on one RWO volume (pi state + IDE settings +
  # workspace). Two replicas would double-write every one of them, and RWO
  # Longhorn volumes deadlock a rolling update on multi-attach anyway —
  # Recreate is not a stopgap, it is the only correct strategy here. Every
  # stateful workload on this cluster does the same (omnigent-server,
  # pi-agent-N, opendesign).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
        app.kubernetes.io/instance: code-server
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: code-server
        helm.sh/chart: code-server-0.1.0
        app: code-server
      annotations:
        # Roll the pod when the settings seed changes; otherwise an edited
        # ConfigMap sits unapplied until something else triggers a restart.
        checksum/settings: 2340c119ce217926f84dc8086c067f705efdb9e065c84b581dd18d71859f7680
        checksum/gitconfig: b0ea14d06c87be69ff719da19f2ab9b49f0e72e3e0e0312649095f57a925658a
    spec:
      # code-server + pi make no Kubernetes API calls; a mounted ServiceAccount
      # token would be pure attack surface on a pod whose whole job is running
      # arbitrary model-authored code.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: pi-seed
          image: ghcr.io/woowtech/woow-code-server-amd64@sha256:fa9d6eb67d47a14d00a5409df6dc540f73f9dfbf3ea1a506b79b6aa101005d9d
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              /usr/local/bin/pi-seed
              # Seed the IDE user dir (a subPath mount gets no image content —
              # unlike podman, where a named volume is seeded from the image
              # on first mount, this PVC subPath starts genuinely empty).
              mkdir -p /ide
              if [ ! -f /ide/settings.json ]; then
                cp /seed/settings.json /ide/settings.json
              fi
              # Idempotent merge so an upgraded required-key set always lands
              # while a user's own edits to other keys survive.
              tmp=$(mktemp)
              jq -S -s '.[0] * .[1]' /ide/settings.json /seed/settings.json > "$tmp" && mv "$tmp" /ide/settings.json
          env:
            - name: PI_AGENT_DATA_DIR
              value: /data/pi-agent
            - name: PI_DEFAULT_PROVIDER
              value: "openai-codex"
            - name: PI_DEFAULT_MODEL
              value: "gpt-5.6-sol"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: pi-data
              mountPath: /data/pi-agent
            - name: pi-data
              mountPath: /ide
              subPath: ide-user
            - name: settings
              mountPath: /seed
              readOnly: true
      containers:
        - name: code-server
          image: ghcr.io/woowtech/woow-code-server-amd64@sha256:fa9d6eb67d47a14d00a5409df6dc540f73f9dfbf3ea1a506b79b6aa101005d9d
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          # LOAD-BEARING: the image's own ENTRYPOINT is
          # ["/usr/bin/entrypoint.sh", "--bind-addr", "0.0.0.0:8080", "."] —
          # the trailing "." is a positional folder arg that code-server
          # prefers over anything appended after it, so `workingDir` above
          # (not an arg here) is what actually selects the default folder.
          # We do NOT set `command:`, so Kubernetes uses that ENTRYPOINT
          # as-is and `args:` below is appended after it — verified directly
          # against this exact image: `entrypoint.sh --bind-addr 0.0.0.0:8080
          # . --trusted-origins <host>` starts cleanly and the extra flag
          # does not disturb the positional "." folder arg ahead of it.
          args:
            # Defensive only: a proxy that fails to forward the real
            # Host/Origin makes code-server 403 the WebSocket upgrade — a
            # dead sidebar/terminal that looks exactly like the ServiceWorker
            # secure-context bug but is an unrelated failure mode. cloudflared
            # already forwards Host correctly by default; this just removes
            # the ambiguity at zero cost. See PARITY_CONTRACT.md's webview
            # gate verdict. (--trusted-origins takes a type:"string[]" value,
            # confirmed by reading code-server's own bundled cli.js.)
            - --trusted-origins
            - code-server-woow-k3s.woowtech.io
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: code-server-auth
                  key: PASSWORD
            - name: TZ
              value: "Asia/Taipei"
            - name: PI_AGENT_DATA_DIR
              value: /data/pi-agent
            - name: PI_CODING_AGENT_DIR
              value: /data/pi-agent
            - name: PI_TELEMETRY
              value: "0"
            - name: PI_SKIP_VERSION_CHECK
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          # A cold PVC can take a while to attach; the startup probe buys
          # that time without loosening liveness once the process is up.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: pi-data
              mountPath: /data/pi-agent
            - name: pi-data
              mountPath: /home/coder/.local/share/code-server/User
              subPath: ide-user
            - name: workspace
              mountPath: /workspace
            # git's SYSTEM config. See configmap-gitconfig.yaml for why this
            # is /etc/gitconfig and not ~/.gitconfig.
            - name: gitconfig
              mountPath: /etc/gitconfig
              subPath: gitconfig
              readOnly: true
      volumes:
        - name: pi-data
          persistentVolumeClaim:
            claimName: code-server-pi-data
        - name: workspace
          persistentVolumeClaim:
            claimName: code-server-workspace
        - name: settings
          configMap:
            name: code-server-settings
            defaultMode: 0444
        - name: gitconfig
          configMap:
            name: code-server-gitconfig
            defaultMode: 0444
