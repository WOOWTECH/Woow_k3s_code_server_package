# Source: code-server/templates/cronjob-backup.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: code-server-backup
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/instance: code-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: code-server
    helm.sh/chart: code-server-0.1.0
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: code-server-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          # Both the app's PVCs and the backup PVC are RWO — this pod MUST
          # land on the same node that already holds them, or the mount
          # simply fails. Longhorn has no backup target configured on
          # woow-k3s and no cluster-wide recurring jobs, so this CronJob is
          # the only data protection in place; there is nothing monitoring
          # whether it actually ran (see docs/DEPLOYMENT.md — house-wide gap,
          # not specific to this chart).
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: code-server
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsUser: 1000
          containers:
            - name: backup
              image: docker.io/library/busybox:1.36
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  ts=$(date +%Y%m%d-%H%M%S)
                  keep=7

                  backup_one() {
                    name="$1"; src="$2"; exclude="${3:-}"
                    dest="/backup/${name}-${ts}.tar.gz"
                    echo "==> backing up ${src} -> ${dest}"
                    # busybox tar exits 1 when a file changes size while being
                    # read (normal under a live directory) — tolerate rc=1,
                    # fail on anything else.
                    if [ -n "${exclude}" ]; then
                      tar czf "${dest}" -C "${src}" --exclude="${exclude}" . || { rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; }
                    else
                      tar czf "${dest}" -C "${src}" . || { rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; }
                    fi
                    # Verify before counting it as a real backup — an archive
                    # that fails its own integrity check is worse than none,
                    # because it looks like protection until restore day.
                    if ! tar tzf "${dest}" >/dev/null 2>&1; then
                      echo "FAIL: ${dest} did not pass tar tzf verification" >&2
                      rm -f "${dest}"
                      exit 1
                    fi
                    echo "OK: ${dest} verified"
                    # Prune to the newest N.
                    ls -1t /backup/${name}-*.tar.gz 2>/dev/null | tail -n +$((keep + 1)) | xargs -r rm -f
                  }

                  backup_one code-server-pi /data/pi-agent models-store.json
                  backup_one code-server-workspace /workspace
              volumeMounts:
                - name: pi-data
                  mountPath: /data/pi-agent
                  readOnly: true
                - name: workspace
                  mountPath: /workspace
                  readOnly: true
                - name: backup
                  mountPath: /backup
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 512Mi}
          volumes:
            - name: pi-data
              persistentVolumeClaim:
                claimName: code-server-pi-data
            - name: workspace
              persistentVolumeClaim:
                claimName: code-server-workspace
            - name: backup
              persistentVolumeClaim:
                claimName: code-server-backup
