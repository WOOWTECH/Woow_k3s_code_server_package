apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server-cloudflared
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/instance: code-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: code-server
    helm.sh/chart: code-server-0.1.0
    app: code-server-cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: code-server-cloudflared
  template:
    metadata:
      labels:
        app: code-server-cloudflared
      annotations:
        checksum/config: d0b02c50e651bb41691ac5486c0dfcd26ef16a375286ccceeaf8238f44ac98ab
    spec:
      automountServiceAccountToken: false
      # Spread the replicas: two tunnel pods on the same node buys nothing
      # when that node's container runtime is what fails.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: code-server-cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - --metrics
            - 0.0.0.0:20241
            - run
          ports:
            - name: metrics
              containerPort: 20241
          livenessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: code-server-cloudflared
        - name: creds
          secret:
            secretName: code-server-cf-creds
