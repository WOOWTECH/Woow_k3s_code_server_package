# Source: code-server/templates/configmap-settings.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-server-settings
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/instance: code-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: code-server
    helm.sh/chart: code-server-0.1.0
data:
  # The 6 required keys from PARITY_CONTRACT.md §2.5, byte-for-byte the same
  # values as the podman package's baked settings.json and the HA add-on's
  # opt/acp-settings.json. The initContainer below jq-merges this into
  # /home/coder/.local/share/code-server/User/settings.json on every start —
  # idempotent, so a user's own edits to other keys survive.
  settings.json: |
    {
        "acp.agents": {
            "pi": {
                "command": "pi-code",
                "args": [],
                "env": {}
            }
        },
        "extensions.autoUpdate": "off",
        "security.workspace.trust.enabled": false,
        "security.workspace.trust.startupPrompt": "never",
        "security.workspace.trust.banner": "never",
        "security.workspace.trust.emptyWindow": false
    }
