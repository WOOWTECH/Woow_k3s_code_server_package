# -----------------------------------------------------------------------------
# Secrets for Woow_k3s_code_server_package — PLACEHOLDERS ONLY.
# Never commit real values, and never `kubectl apply` this file as-is.
#
# The chart does not create these (secrets.create=false). Copy this file
# OUTSIDE the repo, replace every REPLACE_ME value, then apply that copy:
#   kubectl --context woow-k3s -n code-server apply -f /secure/path/secrets.yaml
#
# The equivalent imperative form, which is what docs/DEPLOYMENT.md uses and
# what created the live Secrets:
#   kubectl -n code-server create secret generic code-server-auth \
#     --from-literal=PASSWORD='<long random password>'
#   kubectl -n code-server create secret generic code-server-cf-creds \
#     --from-file=credentials.json=/secure/path/<tunnel-id>.json
#
# For a throwaway test release the chart can generate both instead:
#   helm install ... --set secrets.create=true \
#     --set secrets.authPassword="$(openssl rand -hex 24)" \
#     --set-file secrets.cloudflareCredentialsJson=/secure/path/creds.json
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  # Must match auth.existingSecret.
  name: code-server-auth
  namespace: code-server
  labels:
    app.kubernetes.io/part-of: code-server
type: Opaque
stringData:
  # code-server's only access control on a public Cloudflare hostname: one
  # shared password, no MFA. Make it long and random, keep it in the password
  # manager, and rotate it by updating this Secret and restarting the pod.
  PASSWORD: "REPLACE_ME_LONG_RANDOM_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  # Must match cloudflare.existingCredentialsSecret.
  name: code-server-cf-creds
  namespace: code-server
  labels:
    app.kubernetes.io/part-of: code-server
type: Opaque
stringData:
  # The locally-managed tunnel's credentials file, verbatim, as written by
  # `cloudflared tunnel create` / the Cloudflare API. Keys: AccountTag,
  # TunnelID, TunnelSecret. The TunnelSecret is the credential — treat this
  # file like a private key.
  credentials.json: |
    {"AccountTag":"REPLACE_ME_ACCOUNT_TAG","TunnelID":"REPLACE_ME_TUNNEL_UUID","TunnelSecret":"REPLACE_ME_TUNNEL_SECRET"}
---
# Only needed if the GHCR package is ever made private (imagePullSecrets.enabled=true).
# Create it with `kubectl create secret docker-registry` rather than by hand:
#   kubectl -n code-server create secret docker-registry ghcr-woowtech \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT with read:packages>
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-woowtech
  namespace: code-server
  labels:
    app.kubernetes.io/part-of: code-server
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: "REPLACE_ME_DOCKERCONFIGJSON"
