name: chart

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "values-woow.yaml"
      - ".github/workflows/chart.yml"
  pull_request:
    paths:
      - "charts/**"
      - "values-woow.yaml"
      - ".github/workflows/chart.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.5

      - name: helm lint
        run: helm lint charts/code-server -f values-woow.yaml

      - name: helm template (placeholder tunnel ID — real one is created out of band)
        run: |
          mkdir -p deploy/rendered
          helm template code-server charts/code-server \
            --namespace code-server \
            -f values-woow.yaml \
            --set cloudflare.tunnelId=00000000-0000-0000-0000-000000000000 \
            > deploy/rendered/code-server-woow.yaml

      - name: Guard against committed credentials
        run: |
          set -e
          file=deploy/rendered/code-server-woow.yaml
          leak=0
          if grep -nE 'PASSWORD: ' "$file"; then leak=1; fi
          if grep -nE 'credentials\.json: \{' "$file"; then leak=1; fi
          if grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' "$file"; then leak=1; fi
          if [ "$leak" -ne 0 ]; then
            echo "::error::rendered manifest contains what looks like a credential; refusing to commit"
            exit 1
          fi
          echo "no credential markers found in $file"

      - name: "Shared-file hash check (source of truth: Woow_podman_code_server_package)"
        # This chart does not vendor pi-code/pi.sh/pi-seed itself (it ships no
        # image), but it DOES pin the same PI_CODING_AGENT_VERSION / etc as
        # the other two repos in values.yaml. This step is a placeholder for
        # a future check that fetches the podman repo's published
        # rootfs/opt/SHA256SUMS and cross-checks the pinned image's
        # `pi --version` once that image is public — see docs/DEPLOYMENT.md.
        run: |
          echo "pi.codingAgentVersion pinned in values.yaml:"
          grep -A1 "^pi:" charts/code-server/values.yaml | grep codingAgentVersion

      - name: Upload rendered manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-server-woow-rendered
          path: deploy/rendered/code-server-woow.yaml

      - name: Commit rendered manifest back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/rendered/code-server-woow.yaml
          if git diff --cached --quiet; then
            echo "no changes to rendered manifest; skipping commit"
            exit 0
          fi
          git commit \
            -m "chore(chart): re-render deploy/rendered/code-server-woow.yaml" \
            -m "Auto-generated from charts/code-server + values-woow.yaml with cloudflare.tunnelId=<placeholder>. Source: ${{ github.sha }}"
          git push
