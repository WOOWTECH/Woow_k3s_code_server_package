# WoowTech internal instance — namespace code-server, context woow-k3s.
#
# Secrets are NOT in this file. Create them out of band before installing —
# see docs/DEPLOYMENT.md:
#   kubectl -n code-server create secret generic code-server-auth --from-literal=PASSWORD=...
#   kubectl -n code-server create secret generic code-server-cf-creds --from-file=credentials.json=...
#   kubectl -n code-server create secret docker-registry ghcr-woowtech --docker-server=ghcr.io ...   (only if the image package is private)

image:
  repository: ghcr.io/woowtech/woow-code-server-amd64
  # Published by Woow_podman_code_server_package's build.yml on merge to
  # main (run 34414564430, 2026-09-09, PR #2). Supersedes the first
  # digest (8c35da35...) published from PR #1 — that build's pi-seed
  # crash-looped on a real k3s PVC (chmod EPERM on a root-owned mount
  # root; fsGroup grants group-write, not ownership). Pinned by digest,
  # not the floating :main tag. Verified pullable ANONYMOUSLY (podman
  # logout ghcr.io; pull succeeded) — the package inherited public
  # visibility from the public source repo, so no imagePullSecret is
  # needed after all (contrary to the chart's own conservative default
  # below).
  digest: "sha256:6e216715ec73c81a7ed099bc59005a93b987ec855abc104817aca364a5fbe3c0"
  tag: "main"
  pullPolicy: IfNotPresent

imagePullSecrets:
  # Confirmed unnecessary for this image (see above) — GHCR packages in
  # this org inherit their source repo's public visibility automatically,
  # they do not default to private the way a bare `docker push` would.
  enabled: false
  name: ghcr-woowtech

timezone: Asia/Taipei

pi:
  codingAgentVersion: "0.83.0"
  acpVersion: "0.0.33"
  acpClientVersion: "0.2.0"
  defaultProvider: "openai-codex"
  defaultModel: "gpt-5.6-sol"

auth:
  existingSecret: code-server-auth
  create: false

persistence:
  # Explicit and required — see values.yaml's comment. woow-k3s carries TWO
  # StorageClasses marked (default) (local-path and longhorn); an omitted
  # value here would silently bind the wrong one.
  storageClassName: longhorn
  piData:
    size: 5Gi
  workspace:
    size: 20Gi
  backup:
    enabled: true
    size: 20Gi

cloudflare:
  enabled: true
  # Tunnel created 2026-09-09 via the Cloudflare API (account
  # 9c27f623ee596e0b67be56263bcb1974, zone woowtech.io). DNS CNAME
  # code-server-woow-k3s.woowtech.io -> f36600ac-....cfargotunnel.com
  # created in the same pass.
  tunnelId: "f36600ac-2ebf-49b0-b878-74334944f3cb"
  existingCredentialsSecret: code-server-cf-creds
  hostname: code-server-woow-k3s.woowtech.io
  replicas: 2

networkPolicy:
  enabled: false   # matches house default (pi-agent-woow, omnigent); flip on when ready to harden

# resources / podSecurityContext left at chart defaults (4 CPU / 8Gi limits —
# this cluster also hosts 16 production Odoo tenants, so limits are
# deliberately conservative, not omnigent's 16/24Gi).
