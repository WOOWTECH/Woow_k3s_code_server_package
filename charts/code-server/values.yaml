# Default values for the code-server chart.
#
# The defaults are deliberately NOT installable as-is: persistence.storageClassName
# has no default (see below) and Secrets are never generated unless you ask for
# them. A per-team install should only need to override image.digest,
# persistence.storageClassName, secrets/auth.existingSecret and cloudflare.*.
# The live WoowTech instance is values/woow-k3s/code-server.yaml.
#
# Shared contract: PI_CODING_AGENT_VERSION, PI_ACP_VERSION, ACP_CLIENT_VERSION
# and the pi state layout are pinned across this chart, Woow_podman_code_server_package
# and Woow_ha_code_server_add_on. See PARITY_CONTRACT.md before changing any
# of the pi_* values below.

nameOverride: ""
fullnameOverride: ""

# helm.sh/resource-policy: keep on every object that holds state — the pi-data,
# workspace and backup PVCs, and any Secret this chart creates. `helm uninstall`
# then leaves the data (and the pi login) behind; scripts/uninstall.sh prints
# the explicit kubectl command for the rare case you really do want it gone.
# Turn this off only for throwaway test releases you intend to delete cleanly.
keepOnUninstall: true

# The chart renders NO Namespace. Helm keeps its release record in the release
# namespace, so a chart-owned Namespace makes `helm uninstall` able to delete
# the namespace — and with it the kept PVCs above. Create it out of band:
#   kubectl --context woow-k3s create namespace code-server
#   (or: helm upgrade --install ... --create-namespace)

image:
  # This chart consumes the SAME image the podman package builds and tests —
  # not a separate k3s-specific layer. One image means the pi layer (Node 22,
  # pi 0.83.0, pi-acp 0.0.33, ACP Client 0.2.0, pi-code, pi.sh, pi-seed, the
  # settings seed) physically cannot drift between podman and k3s.
  repository: ghcr.io/woowtech/woow-code-server-amd64
  # Prefer digest (immutable) over tag — the live instance pins one, published
  # by Woow_podman_code_server_package's build.yml. With both empty the chart
  # falls back to appVersion with "+" replaced by "_" (an OCI tag may not
  # contain "+"); that tag is only a placeholder, pin a digest for real use.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

# Only needed if the ghcr.io/woowtech package is private. It is not: GHCR
# packages inherit their source repo's visibility, and an anonymous pull of the
# pinned digest succeeds (verified 2026-09-09). Off by default so a fresh
# install does not reference a Secret that does not exist.
imagePullSecrets:
  enabled: false
  name: ghcr-woowtech

timezone: Asia/Taipei

# The pi agent's own version pins — see PARITY_CONTRACT.md §2.1. These are
# recorded here for documentation and for the CI hash-verification step;
# they are NOT build args (this chart does not build an image), but the
# pinned image is expected to have been built with exactly these.
pi:
  codingAgentVersion: "0.83.0"
  acpVersion: "0.0.33"
  acpClientVersion: "0.2.0"
  # Applied by pi-seed only when this deployment's pi has no settings.json
  # yet (i.e. before the first `pi login`). Empty = no first-run default.
  defaultProvider: ""
  defaultModel: ""

# Git identity, rendered into a ConfigMap and mounted at /etc/gitconfig.
#
# Not cosmetic: git's identity auto-detect needs a hostname containing a
# dot, and a k3s pod hostname (code-server-7b6f95f546-85r6s) has none — so
# git rejects the derived `coder@code-server-7b6f95f546-85r6s.(none)` and
# `git commit` exits 128 out of the box. `git config --global` inside the
# pod does work, but $HOME is not on the PVC, so it is lost on every
# restart. /etc/gitconfig is git's system layer: it applies whatever HOME
# is, which also means the ACP panel's pi (whose HOME is re-pointed at the
# pi state volume by pi-code) sees the same identity the terminal does.
#
# Leave both empty to mount nothing and keep the current behaviour.
git:
  userName: ""
  userEmail: ""

codeServer:
  port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi

# code-server's own auth: the PASSWORD key of an existing Secret. The Secret
# itself is created out of band (see examples/secrets.example.yaml) unless you
# set secrets.create=true below.
auth:
  existingSecret: code-server-auth

# Secret generation. OFF by default: the chart references Secrets that already
# exist, so an upgrade can never overwrite a real password or a real tunnel
# credential, and no secret value has to live in a values file. Every key is
# documented with placeholders in examples/secrets.example.yaml.
#
# With create=true the values below are required() — there is no default and no
# weak fallback, because this deployment is reachable on a public hostname.
secrets:
  create: false
  # -> Secret {auth.existingSecret}, key PASSWORD
  authPassword: ""
  # -> Secret {fullname}-cf-creds, key credentials.json (the locally-managed
  # tunnel's credentials file, verbatim). Use --set-file, never a committed file.
  cloudflareCredentialsJson: ""

persistence:
  # NEVER omit — this cluster carries TWO StorageClasses both marked
  # (default) (local-path and longhorn), so an unset value is
  # non-deterministic and would most likely bind node-local, unreplicated
  # local-path — a rescheduled pod would silently come up with an empty
  # store. The chart fails to render if this is empty.
  storageClassName: ""
  piData:
    size: 5Gi
  workspace:
    size: 20Gi
  backup:
    enabled: false
    size: 20Gi

backup:
  # "17 3 * * *" matches the house convention (pi-agent-woow/opendesign-backup).
  schedule: "17 3 * * *"
  # Retain the newest N archives per volume (pi-data, workspace); older ones
  # are pruned by the CronJob itself.
  keep: 7

cloudflare:
  # OFF by default: a chart default must never try to start a connector, and a
  # test install has no tunnel of its own. The live instance sets this true
  # together with tunnelId, hostname and existingCredentialsSecret.
  enabled: false
  image: cloudflare/cloudflared:2026.7.3
  # Tunnel UUID (locally-managed tunnel) — required when enabled. Routing
  # lives in this chart, not the Cloudflare dashboard.
  tunnelId: ""
  # Name of an existing Secret holding credentials.json. Required when
  # cloudflare.enabled=true unless secrets.create=true generates it.
  existingCredentialsSecret: ""
  hostname: ""   # e.g. code-server-woow-k3s.woowtech.io
  # Extra ingress rules appended to this tunnel's routing table verbatim —
  # only relevant if this tunnel is ever asked to front a sibling release.
  extraIngress: []
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# NOT the house "shared NPM + shared tunnel per namespace" pattern
# (Woow_k3s_pi_agent_package/deploy/npm/) — that exists to let several
# sibling releases in ONE namespace share tunnel/auth infrastructure without
# one release's upgrade touching another's routing table. This chart is a
# single release in its own namespace, so that coupling problem does not
# exist here; a dedicated cloudflared Deployment is simpler and matches this
# chart's own single tenant. Revisit only if a second code-server release
# ever needs to share this namespace.

# Lateral-movement containment for a pod whose whole job is running
# model-authored code. OPT-IN: enabling it on a running instance adds a
# NetworkPolicy that the live pod has never been subject to, so it is a
# runtime change and stays off until it is rolled out deliberately (with the
# egress allow-list checked against what pi actually reaches).
networkPolicy:
  enabled: false
  # Additional cloudflared Deployments allowed to reach this release, by
  # their `app` label — only needed if this tunnel is ever shared.
  extraCloudflaredApps: []
  # Let the `helm test` smoke pod reach the Service. Without it the policy
  # below denies the test pod and `helm test` fails on a healthy release.
  allowTestPod: true
  # Sources allowed to reach port 8080 directly. kubelet health probes come
  # from the node, not from a pod, so the node addresses must be listed.
  # woow-k3s nodes are 192.168.10.21-24: a /24 covers them, where the former
  # /16 default also admitted 255 other subnets.
  nodeCIDRs:
    - 192.168.10.0/24
  # Carved out of the "allow the internet" egress rule below: the pod cluster
  # CIDR, the Service CIDR, the whole LAN and the cloud metadata address.
  blockedCIDRs:
    - 10.42.0.0/16
    - 10.43.0.0/16
    - 192.168.0.0/16
    - 169.254.169.254/32

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  # Without this, kubelet walks the whole PVC on EVERY pod start and ORs the
  # owner's permission bits into the group's. That silently re-widened
  # /data/pi-agent/auth.json — pi's OAuth credential — from 0600 to 0660 on
  # this deployment, while the byte-identical podman container kept it at
  # 0600. Same image, same umask (0022); the difference was entirely kubelet.
  #
  # OnRootMismatch only does that walk when the volume's ROOT directory does
  # not already have the expected owner/mode, which is the first mount and
  # then never again. It is also the documented fix for slow starts on large
  # volumes.
  #
  # The practical exposure here was nil — group 1000 is the run user's own
  # private group and no second identity exists in the pod — but a
  # credential file whose mode depends on which orchestrator mounted it is a
  # parity break, and PARITY_CONTRACT P28 asserts 0600.
  fsGroupChangePolicy: OnRootMismatch

extraEnv: []
#  - name: HTTPS_PROXY
#    value: http://proxy:3128

nodeSelector: {}
tolerations: []
affinity: {}
