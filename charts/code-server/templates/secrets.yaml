{{- /*
Secrets, rendered only with secrets.create=true.

By default this file renders nothing: both Secrets are created out of band from
examples/secrets.example.yaml and the chart only references them by name, so no
upgrade can overwrite a real code-server password or a real tunnel credential,
and no secret value ever has to sit in a values file. With create=true every
value is required() — code-server here is reachable on a public hostname, so a
blank or defaulted password is not an option the chart offers.
*/ -}}

{{- /* Values that were renamed in the Helm-migration pass. Fail loudly rather
       than silently ignoring a values file that still sets them. */ -}}
{{- if .Values.auth.create }}{{ fail "auth.create was replaced by secrets.create" }}{{ end }}
{{- if .Values.auth.password }}{{ fail "auth.password was replaced by secrets.authPassword" }}{{ end }}
{{- if .Values.cloudflare.credentialsJson }}{{ fail "cloudflare.credentialsJson was replaced by secrets.cloudflareCredentialsJson" }}{{ end }}
{{- if .Values.namespace }}{{ fail "namespace.* is gone: this chart never renders a Namespace (Helm would be able to delete the release namespace, and the kept PVCs with it). Create it with `kubectl create namespace` or `helm --create-namespace`." }}{{ end }}

{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "code-server.labels" . | nindent 4 }}
  {{- include "code-server.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  PASSWORD: {{ required "secrets.authPassword is required when secrets.create=true — code-server is reached on a public Cloudflare hostname and this chart will not ship one with a blank password" .Values.secrets.authPassword | quote }}
{{- if and .Values.cloudflare.enabled (not .Values.cloudflare.existingCredentialsSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "code-server.fullname" . }}-cf-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "code-server.labels" . | nindent 4 }}
  {{- include "code-server.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  credentials.json: {{ required "secrets.cloudflareCredentialsJson is required when secrets.create=true and cloudflare.enabled=true (use --set-file secrets.cloudflareCredentialsJson=/path/to/credentials.json)" .Values.secrets.cloudflareCredentialsJson | quote }}
{{- end }}
{{- end }}
