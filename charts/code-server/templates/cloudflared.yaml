{{- if .Values.cloudflare.enabled }}
{{- if and (not .Values.cloudflare.existingCredentialsSecret) (not .Values.secrets.create) }}
{{- fail "cloudflare.enabled=true needs a credentials file: set cloudflare.existingCredentialsSecret, or secrets.create=true with --set-file secrets.cloudflareCredentialsJson=/path/to/credentials.json" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "code-server.fullname" . }}-cloudflared
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "code-server.labels" . | nindent 4 }}
    app: {{ include "code-server.fullname" . }}-cloudflared
spec:
  replicas: {{ .Values.cloudflare.replicas }}
  selector:
    matchLabels:
      app: {{ include "code-server.fullname" . }}-cloudflared
  template:
    metadata:
      labels:
        app: {{ include "code-server.fullname" . }}-cloudflared
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-cloudflared.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # Spread the replicas: two tunnel pods on the same node buys nothing
      # when that node's container runtime is what fails.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: {{ include "code-server.fullname" . }}-cloudflared
      containers:
        - name: cloudflared
          image: {{ .Values.cloudflare.image }}
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - --metrics
            - 0.0.0.0:20241
            - run
          ports:
            - name: metrics
              containerPort: 20241
          livenessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.cloudflare.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "code-server.fullname" . }}-cloudflared
        - name: creds
          secret:
            secretName: {{ .Values.cloudflare.existingCredentialsSecret | default (printf "%s-cf-creds" (include "code-server.fullname" .)) }}
{{- end }}
