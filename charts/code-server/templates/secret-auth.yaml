{{- if .Values.auth.create }}
{{- if not .Values.auth.password }}
{{- fail "auth.password must be set when auth.create=true — code-server is reached on a public Cloudflare hostname and this chart will not ship one with a blank password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "code-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  PASSWORD: {{ .Values.auth.password | quote }}
{{- end }}
