apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "code-server.fullname" . }}-settings
  labels:
    {{- include "code-server.labels" . | nindent 4 }}
data:
  # Required VS Code settings (PARITY_CONTRACT 1.1 §2.5), merged into the IDE
  # user settings.json on every start by the pi-seed init container.
  settings.json: |
    {
        "acp.agents": {
            "pi": {
                "command": "pi-code",
                "args": [],
                "env": {}
            },
            "claude": {
                "command": "claude-agent-acp",
                "args": [],
                "env": {}
            }
        },
        "extensions.autoUpdate": "off",
        "security.workspace.trust.enabled": false,
        "security.workspace.trust.startupPrompt": "never",
        "security.workspace.trust.banner": "never",
        "security.workspace.trust.emptyWindow": false
    }
  # System gitconfig (mounted at /etc/gitconfig). The credential helper answers
  # only for git.tokenHosts and only when GIT_TOKEN is set (auth.gitToken);
  # otherwise it prints nothing and git falls through to its normal prompt.
  gitconfig: |
    [init]
        defaultBranch = main
    {{- if or .Values.git.userName .Values.git.userEmail }}
    [user]
    {{- with .Values.git.userName }}
        name = {{ . }}
    {{- end }}
    {{- with .Values.git.userEmail }}
        email = {{ . }}
    {{- end }}
    {{- end }}
    {{- range .Values.git.tokenHosts }}
    [credential "{{ . }}"]
        helper = "!f() { [ \"$1\" = get ] && [ -n \"$GIT_TOKEN\" ] && printf 'username=%s\\npassword=%s\\n' '{{ $.Values.git.tokenUsername }}' \"$GIT_TOKEN\"; }; f"
    {{- end }}
