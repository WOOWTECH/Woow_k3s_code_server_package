{{- if not .Values.auth.existingSecret }}
{{- /* admin_password: explicit (platform sensitive_values) wins; else reuse the live
       Secret's value so `helm upgrade` never rotates the tenant's password; else
       generate once. code-server reads it from $PASSWORD at start, so a reset is a
       Secret change + rollout restart (helm_secret carrier).
       The optional keys are ALWAYS rendered, "" when unset (#1556): Kubernetes merges
       stringData into data, and helm's three-way patch only drops the stringData
       entry when a key disappears from the render — the data key (the OLD key) stays
       and the pod keeps getting it after the tenant cleared the field (prod
       2026-10-07). Writing "" is what clears it. Every consumer treats an empty value
       as "no key": Claude Code (ANTHROPIC_API_KEY="" is OpenRouter's documented
       setting), pi (OPENROUTER_API_KEY), the git credential helper ([ -n "$GIT_TOKEN" ]). */ -}}
{{- $adminPassword := include "code-server.resolveSecretValue" (dict "ctx" . "explicit" .Values.config.sensitive.admin_password "key" "admin_password") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "code-server.secretName" . }}
  labels:
    {{- include "code-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin_password: {{ $adminPassword | quote }}
  anthropic_api_key: {{ .Values.auth.anthropicApiKey | default "" | toString | quote }}
  openrouter_api_key: {{ .Values.auth.openrouterApiKey | default "" | toString | quote }}
  git_token: {{ .Values.auth.gitToken | default "" | toString | quote }}
{{- end }}
