apiVersion: v2
name: code-server
description: |
  code-server (browser VS Code) cloud service chart, with the Pi coding agent,
  Claude Code and Codex built in.

  A per-tenant IDE: code-server on port 8080 is the ONLY entrance, reached
  through the platform Cloudflare tunnel. NO auth-proxy: code-server's own
  password login is the gate (it has built-in login throttling: 2 attempts
  per minute, 12 per hour). The password is the platform-supplied tenant
  credential (config.sensitive.admin_password, helm_secret carrier): the
  tenant resets or sets it from the PaaS service page, which re-renders the
  chart Secret and restarts the pod. code-server has no username and no
  in-app password change, so the platform is the only authority.

  Built in (WOOWTECH code-server PARITY_CONTRACT 1.1 baseline): pi 0.99.1 +
  pi-acp in the ACP chat sidebar and on the terminal PATH; Claude Code
  2.1.285 as the sidebar's second agent (claude-agent-acp), on the terminal
  PATH and as the official extension. PaaS additions on top of the baseline
  (paas-odoo-ci code-server/ image layer): zh-TW language pack, runtime
  extensions persisted on the volume, the omnigent CLI, optional API keys
  and a Git token from the platform.

  Omnigent host (0.1.2, omnigentHost.*): the shared omnigent-host kit
  (woow-paas-charts shared/omnigent-host, vendored byte-identically) runs
  INSIDE the code-server container: the image's ENTRYPOINT stub starts the
  kit supervisor in the background, which keeps `omnigent host` running
  once the tenant has run `omnigent login <url>` in the IDE terminal, so an
  Omnigent service can run Claude Code / pi sessions here with the
  tenant's own logins. No sidecar and no resource split: the host shares
  the plan limits; the platform never holds an Omnigent token; without a
  login the supervisor only sleeps.

  Session cookie (0.1.4, cookieProxy): a small nginx in the pod is the
  entrance and adds HttpOnly + Secure to code-server's session cookie;
  code-server itself listens on a pod-private unix socket.

  Derived from WOOWTECH/Woow_k3s_code_server_package (charts/code-server
  0.1.0) and re-cut to the PaaS contract: release-prefixed names, no
  cloudflared, no backup CronJob (the platform keeps the PVCs), non-root,
  default-deny NetworkPolicy with internet-only egress.
  Deployed per-tenant by paas-operator as svc-{ref[:8]} into a paas-ws-* namespace.
type: application
# 0.1.0 = first cut (code-server 4.139.1, pi 0.99.1, Claude Code 2.1.285).
# 0.1.1 = required settings add chat.disableAIFeatures (the image drops Copilot).
# 0.1.2 = omnigent host inside the code-server container (shared kit, image
#         ENTRYPOINT stub; omnigentHost.enabled, default on; serverUrl in a
#         runtime ConfigMap, no restart); the tenant's HOME state (~/.ssh,
#         ~/.config, ~/.local incl. npm/uv tools, ~/.gitconfig, history) on the
#         pi-data volume, ~/.cache a size-limited emptyDir; claude.ai MCP
#         connectors off; core.quotepath=false; MAKEFLAGS & co. = CPU limit;
#         code-server reads only a read-only chart config (auth: password) and
#         gets --auth password, so the persisted ~/.config cannot switch the
#         password login off; pi-seed is files/pi-seed.sh (executed by tests).
#         Needs the paas-odoo-ci code-server image 20261002.1318 or later
#         (tenant bins after the system dirs, also in the IDE's login shell).
# 0.1.3 = #1378: auth.openrouterApiKey without pi.defaultModel → pi defaults to
#         openrouter / pi.openrouterDefaultModel (seeded into
#         /data/pi-agent/settings.json — absent file: image pi-seed; existing file
#         without a model: files/pi-seed.sh fills the two keys, never overrides).
# 0.1.4 = R8 fixes. #1452: the WHOLE HOME (/home/coder) is the pi volume's home/
#         directory (where ~/.ssh, ~/.config, ~/.local, ~/.pi, ~/.gitconfig and
#         ~/.bash_history already lived, so upgrades keep them); pi-seed also seeds
#         the image's top-level dotfiles no-clobber; HOME 0700. #1458: cookieProxy
#         (nginx in the pod on :8080) adds HttpOnly + Secure to code-server's session
#         cookie; code-server listens on a unix socket. #1434: ephemeral-storage
#         requests/limits on every container (code-server 1Gi/8Gi incl. the 2Gi
#         ~/.cache emptyDir). No image change.
# 0.1.5 = 同工作區 LiteLLM 串接（平台注入另案；接在 charts #133 的 0.1.4 之後）：
#         新 values llmGateway.baseUrl（平台注入 http://<release>-litellm.<ns>.svc.cluster.local:4000/v1，
#         只帶網址、不帶金鑰；租戶自填的非空值優先）→ IDE 容器（終端機）拿到 env LITELLM_BASE_URL，
#         經不入 checksum 的 runtime ConfigMap <fullname>-llm-gateway（envFrom optional）：
#         改／清網址 pod template byte-identical、不重啟 pod，密碼重設的 15 秒 atomic
#         不受影響（tests/test-llm-gateway.sh 鎖住）；執行中的容器下次重啟才看到新值。
#         不設 OPENAI_BASE_URL／ANTHROPIC_BASE_URL。非 http(s) 網址略過、不讓 render 失敗。
#         Omnigent session 也繼承（OG_PASSTHROUGH）。egress 靠既有 sameNamespaceEgress（預設 true），不另開洞。
# 0.1.6 = (charts #153, woow_paas_platform #1441／#1436) same-namespace egress/ingress.
# 0.1.7 = (woow_paas_platform #1556) the optional keys anthropic_api_key /
#         openrouter_api_key / git_token are ALWAYS rendered in the chart Secret, ""
#         when unset. They used to be written only when set: clearing one in the
#         platform (clear_keys) dropped it from stringData, and helm's three-way patch
#         never deletes the data key Kubernetes had merged it into — the Secret and the
#         restarted pod kept the OLD key (prod 2026-10-07). "" is what clears it (same
#         pattern as emqx / headscale ngrok_authtoken, tailscale authkey). Env vars stay
#         secretKeyRef optional; an empty value means "no key" to Claude Code, pi and
#         the git credential helper. Existing services are fixed by their upgrade to
#         this version: a stale key is overwritten with "", and checksum/optional-auth
#         gains a constant ("keys-always-rendered") so that upgrade restarts the pod
#         once and the stale key also leaves the running process.
# 0.1.8 = woow_paas_platform #1637（容量研究，使用者 2026-10-10 核可）: the startupProbe gets
#         timeoutSeconds 5 (it had none = the Kubernetes default 1 s). The first start of a
#         fresh pod (extension host, language servers, the pi / Claude Code CLIs being
#         warmed) can answer /healthz slower than 1 s on a busy node, and 30 one-second
#         misses restarted a pod that was just slow. Readiness / liveness already had 10 s.
# 0.1.9 = INFRA-DOC-007-3 / INFRA-DOC-007-2 (commercial acceptance 2026-10-17):
#         codeServer.loginI18n (default true): the login page in Traditional Chinese via
#         code-server's --i18n (settings ConfigMap code-server-i18n.json, read-only at
#         /etc/code-server/i18n.json; merged over every bundled language, so the zh-tw →
#         en fallback shows it). The password hint no longer says "Password was set from
#         $PASSWORD." but points at the PaaS service page「管理員帳密」. NOTES + README
#         disclose that every process in the IDE container (terminal, extensions, pi,
#         Claude Code, Omnigent sessions) can read the password and the optional keys
#         (/proc/1/environ) and recommend LiteLLM virtual keys; why a start-up stub cannot
#         hide the password in a single-uid container (charts#221 tracks the auth move).
#         The upgrade restarts the pod once (checksum/settings). No image change.
# 0.1.12: Optional code-server-only securityContext override; preserve init/proxy policy.
# 0.1.11: Pass shared-tool inheritance to the image-scoped Omnigent connector kit.
#         Requires the paired Paseo/Omnigent connector image.
# 0.1.10: Codex ACP, persistent CODEX_HOME and shared deployment-local skills/MCP.
#         Requires the paired three-agent image; do not upgrade only the chart.
version: 0.1.12
appVersion: "4.139.1"
keywords: [codex, paas, code-server, vscode, ide, pi-agent, claude-code, omnigent, cloud-service]
